server:
  port: 80
spring:
  cloud:
    gateway:
      routes:
        - id: member
          uri: http://127.0.0.1:8080
          predicates:
            - Path=/member/**
        - id: business
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/business/**
  # 配置CORS相关设置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:1001"
              - "http://localhost:1002"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
