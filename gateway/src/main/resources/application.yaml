server:
  port: 80
spring:
  cloud:
    gateway:
      routes:
        - id: member
          uri: lb://member
          predicates:
            - Path=/member/**
        - id: business
          uri: lb://business
          predicates:
            - Path=/business/**
        - id: batch
          uri: lb://batch
          predicates:
            - Path=/batch/**
        - id: batch
          uri: lb://auth
          predicates:
            - Path=/auth/**
  # 配置CORS相关设置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:1001"
              - "http://localhost:1002"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      database: 0 # Redis 数据库索引（默认为 0）
      host: 127.0.0.1 # Redis 服务器地址
      port: 6379 # Redis 服务器连接端口
      password: qwe123!@# # Redis 服务器连接密码（默认为空）
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接
#test:
#  nacos:
#    server-addr: 127.0.0.1:8848  # Nacos服务器地址，根据实际情况修改
#    namespace: gateway  # 配置的命名空间，这里假设是开发环境，可按需调整
#    group: DEFAULT_GROUP  # 配置组，一般默认是这个，也可根据项目需求改
#    data-id: your-app-config  # 配置文件在Nacos中的数据ID，要和实际上传到Nacos的配置对应
#    username: nacos  # Nacos登录用户名，如果有开启认证的话
#    password: nacos123  # Nacos登录密码，对应上面用户名的密码，如果有开启认证
#    config-retry-time: 3000  # 配置获取失败后的重试时间间隔（毫秒），示例值
#    config-long-poll-timeout: 60000  # 长轮询超时时间（毫秒），用于获取动态配置更新
############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
    # token 名称（同时也是 cookie 名称）
    token-name: satoken
    # token 有效期（单位：秒） 默认30天，-1 代表永久有效
    timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: -1
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
    is-concurrent: true
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
    is-share: true
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
    token-style: uuid
    # 是否输出操作日志
    is-log: true
