# 注册中心名字
spring:
  application:
    name: member
  # 启动环境，nacos会根据不同的配置dataid：member-dev.properties
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: train
      config:
        server-addr: localhost:8848  # nacos server地址
        file-extension: properties  # 配置中心文件后缀
        data-id: member-dev.properties
        import:
        - "nacos:"
        #这里为命名空间，设置的值是id不是name
        namespace: train
  # 配置中心文件
  profiles:
    active: dev
seata:
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      namespace: train
      group: SEATA_GROUP
      username: nacos
      password: nacos
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: train
      group: SEATA_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  # 事务组id 同项目多个模块配置成同一个事务组
  tx-service-group: train-group
  # 配置事务组
  #下面这些完全是放入配置中心配置的
