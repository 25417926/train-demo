server:
  port: 8080
  servlet:
    context-path: /member

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/train?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: train-member
    password: 123456
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 8  # 连接池最大连接数
        max-wait: -1ms  # 最大阻塞等待时间，-1表示无限制
        max-idle: 8  # 最大空闲连接数
        min-idle: 0  # 最小空闲连接数
#       以下为注释掉的配置项，可以根据需要取消注释并进行修改
#       namespace: member
#       group: DEFAULT_GROUP
#       data-id: your-app-config
#       username: nacos
#       password: nacos123
#       config-retry-time: 3000
#       config-long-poll-timeout: 60000

test.nacos: member

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

