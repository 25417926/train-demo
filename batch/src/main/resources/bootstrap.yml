spring:
  application:
    name: batch
  cloud:
    openfeign:
      lazy-attributes-resolution: true
    sentinel:
      transport:
        port: 8719
        dashboard: localhost:18080
      datasource:
        flow:
          nacos:
            server-addr: 192.168.184.130:8848
            data-id: sentinel-batch-flow
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: flow
        degrade:
          nacos:
            server-addr: 192.168.184.130:8848
            data-id: sentinel-batch-degrade
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: degrade
    nacos:
      discovery:
        server-addr: 192.168.184.130:8848
        namespace: train
      config:
        server-addr: 192.168.184.130:8848
        file-extension: properties
        data-id: batch-dev.properties
        import:
          - "nacos:"
        namespace: train
  profiles:
    active: dev

feign:
  sentinel:
    enabled: true
