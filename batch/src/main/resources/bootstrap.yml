# 注册中心名字
spring:
  application:
    name: batch
  #feign enabled改成true后，启动会报出注入失败，需要改成懒加载
  cloud:
    openfeign:
      lazy-attributes-resolution: true
    #Sentinel控台
    sentinel:
      transport:
        port: 8719
        dashboard: localhost:18080
      # sentinel数据源
      datasource:
        # 流控规则
        flow:
          nacos:
            server-addr: localhost:8848
            data-id: sentinel-batch-flow
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: flow
        # 熔断规则
        degrade:
          nacos:
            server-addr: localhost:8848
            data-id: sentinel-batch-degrade
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: degrade
    # 启动环境，nacos会根据不同的配置dataid：member-dev.properties
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848  # nacos server地址
        file-extension: properties  # 配置中心文件后缀
        data-id: batch-dev.properties
        import:
        - "nacos:"
        #这里为命名空间，设置的值是id不是name
        #namespace: train
  # 配置中心文件
  profiles:
    active: dev

#sentinel默认是不监控ffeign的，需要改成true
feign:
  sentinel:
    enabled: true

