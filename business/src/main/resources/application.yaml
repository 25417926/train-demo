server:
  port: 8081
  servlet:
    context-path: /business
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/train-business?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: train-business
    password: 123456
  application:
    name: business
  # Spring Cloud Stream（I01 事务消息探针）
  cloud:
    stream:
      default-binder: rocketmq
      function:
        definition: txProbeConsumer;purchaseConfirmConsumer
      bindings:
        txProbeProducer-out-0:
          destination: TX_PROBE_TOPIC
          producer:
            group: tx-probe-producer
        txProbeConsumer-in-0:
          destination: TX_PROBE_TOPIC
          group: tx-probe-consumer
        # I06 受理事务消息：ORDER_CONFIRM
        purchaseConfirmProducer-out-0:
          destination: order-confirm
          producer:
            group: business-order-confirm
        # I08 ORDER_CONFIRM 消费组：重投 5 次后转 %DLQ%business-order-confirm
        purchaseConfirmConsumer-in-0:
          destination: order-confirm
          group: business-order-confirm
          consumer:
            concurrency: 4
            # 重投由消费端计数控制，关闭进程内重试，避免次数被放大
            maxAttempts: 1
      rocketmq:
        binder:
          name-server: ${rocketmq.name-server}
        bindings:
          txProbeProducer-out-0:
            producer:
              group: tx-probe-producer
              producerType: Trans
              transactionListener: txProbeTransactionListener
              sendMsgTimeout: 3000
          txProbeConsumer-in-0:
            consumer:
              group: tx-probe-consumer
          # I06 受理事务消息：半消息 + 本地事务 + 回查
          purchaseConfirmProducer-out-0:
            producer:
              group: business-order-confirm
              producerType: Trans
              transactionListener: purchaseConfirmTransactionListener
              sendMsgTimeout: 3000
          # I08 消费端：延迟等级 1（重投退避由 RocketMQ 负责）
          purchaseConfirmConsumer-in-0:
            consumer:
              push:
                maxReconsumeTimes: 5
                delayLevelWhenNextConsume: 1
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 8  # 连接池最大连接数
        max-wait: -1ms  # 最大阻塞等待时间，-1表示无限制
        max-idle: 8  # 最大空闲连接数
        min-idle: 0  # 最小空闲连接数
  # 缓存配置
  cache:
    # 缓存类型
    type: redis
    redis:
      # 缓存前缀
      use-key-prefix: true
      key-prefix: train_cache_
      # 缓存空值
      cache-null-values: false
      # 缓存过期时间
      time-to-live: 60s
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    local-cache-scope: statement
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: default
# I11 对账与指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    metrics:
      enabled: true
train:
  reconcile:
    # 每分钟比对 Redis 与 MySQL；差异以 MySQL 账本为准回写 Redis
    enabled: true
    fixed-delay-ms: 60000
    initial-delay-ms: 30000
    # 对账范围：今天 + 未来 N 天
    days-ahead: 1
  metrics:
    # mq_consume_lag 采集的 主题:消费组 列表
    mq-consumers: order-confirm:business-order-confirm,ticket-create:member-ticket-create
    mq-lag-refresh-ms: 60000
    mq-lag-initial-delay-ms: 60000
  close:
    # I12 超时关闭：ZSet 主触发（秒级）+ 扫表兜底（5 分钟）
    enabled: true
    poll-interval-ms: 5000
    poll-initial-delay-ms: 10000
    poll-batch: 100
    sweep-interval-ms: 300000
    sweep-initial-delay-ms: 60000
    sweep-batch: 200
