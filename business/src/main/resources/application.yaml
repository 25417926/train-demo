server:
  port: 8081
  servlet:
    context-path: /business
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/train-business?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: train-business
    password: 123456
  application:
    name: business
  # Spring Cloud Stream（I01 事务消息探针）
  cloud:
    stream:
      default-binder: rocketmq
      function:
        definition: txProbeConsumer
      bindings:
        txProbeProducer-out-0:
          destination: TX_PROBE_TOPIC
        txProbeConsumer-in-0:
          destination: TX_PROBE_TOPIC
      rocketmq:
        binder:
          name-server: ${rocketmq.name-server}
        bindings:
          txProbeProducer-out-0:
            producer:
              group: tx-probe-producer
              producerType: Trans
              transactionListener: txProbeTransactionListener
              sendMsgTimeout: 3000
          txProbeConsumer-in-0:
            consumer:
              group: tx-probe-consumer
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 8  # 连接池最大连接数
        max-wait: -1ms  # 最大阻塞等待时间，-1表示无限制
        max-idle: 8  # 最大空闲连接数
        min-idle: 0  # 最小空闲连接数
  # 缓存配置
  cache:
    # 缓存类型
    type: redis
    redis:
      # 缓存前缀
      use-key-prefix: true
      key-prefix: train_cache_
      # 缓存空值
      cache-null-values: false
      # 缓存过期时间
      time-to-live: 60s
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    local-cache-scope: statement
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: default
