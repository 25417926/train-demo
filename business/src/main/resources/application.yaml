server:
  port: 8081
  servlet:
    context-path: /business
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/train-business?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: train-business
    password: 123456
    hikari:
      # I21 单机出票扩容：消费并发 32 + 受理查询，连接池需高于消费并发数
      maximum-pool-size: 64
      minimum-idle: 8
      connection-timeout: 3000
  application:
    name: business
  # Spring Cloud Stream（I01 事务消息探针）
  cloud:
    stream:
      default-binder: rocketmq
      function:
        definition: txProbeConsumer;purchaseConfirmConsumer;waitlistMatchConsumer
      bindings:
        txProbeProducer-out-0:
          destination: TX_PROBE_TOPIC
          producer:
            group: tx-probe-producer
        txProbeConsumer-in-0:
          destination: TX_PROBE_TOPIC
          group: tx-probe-consumer
        # I06 受理事务消息：ORDER_CONFIRM
        purchaseConfirmProducer-out-0:
          destination: order-confirm
          producer:
            group: business-order-confirm
        # I08 ORDER_CONFIRM 消费组：重投 5 次后转 %DLQ%business-order-confirm
        purchaseConfirmConsumer-in-0:
          destination: order-confirm
          group: business-order-confirm
          consumer:
            # I21 单机出票扩容：与 order-confirm 主题队列数（32）对齐
            concurrency: 32
            # 重投由消费端计数控制，关闭进程内重试，避免次数被放大
            maxAttempts: 1
        # I16 候补补位：关单/退款真实释放库存后触发同票档 FIFO 匹配
        inventoryReleasedProducer-out-0:
          destination: inventory-released
          producer:
            group: business-waitlist-match
        waitlistMatchConsumer-in-0:
          destination: inventory-released
          group: business-waitlist-match
          consumer:
            concurrency: 2
            maxAttempts: 1
      rocketmq:
        binder:
          name-server: ${rocketmq.name-server}
        bindings:
          txProbeProducer-out-0:
            producer:
              group: tx-probe-producer
              producerType: Trans
              transactionListener: txProbeTransactionListener
              sendMsgTimeout: 3000
          txProbeConsumer-in-0:
            consumer:
              group: tx-probe-consumer
          # I06 受理事务消息：半消息 + 本地事务 + 回查
          purchaseConfirmProducer-out-0:
            producer:
              group: business-order-confirm
              producerType: Trans
              transactionListener: purchaseConfirmTransactionListener
              sendMsgTimeout: 3000
          # I08 消费端：延迟等级 1（重投退避由 RocketMQ 负责）
          purchaseConfirmConsumer-in-0:
            consumer:
              group: business-order-confirm
              push:
                maxReconsumeTimes: 5
                delayLevelWhenNextConsume: 1
          # I16 候补补位事件：匹配失败在消费端内部消化，不做 MQ 重投
          inventoryReleasedProducer-out-0:
            producer:
              group: business-waitlist-match
              sendMsgTimeout: 3000
          waitlistMatchConsumer-in-0:
            consumer:
              group: business-waitlist-match
              push:
                maxReconsumeTimes: 5
                delayLevelWhenNextConsume: 1
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        # I21 单机扩容：Redis 3.2 单线程，连接数拉高（96/160 实测 reserve.Lua 平均耗时由 8ms 升到 20ms）
        # 反而更慢，维持 32 个连接；瓶颈已定位为后台 SCAN/KEYS 全库扫描，不在这里
        max-active: 32
        max-wait: 3000ms  # 最大阻塞等待时间
        max-idle: 32  # 最大空闲连接数
        min-idle: 16  # 最小空闲连接数
  # 缓存配置
  cache:
    # 缓存类型
    type: redis
    redis:
      # 缓存前缀
      use-key-prefix: true
      key-prefix: train_cache_
      # 缓存空值
      cache-null-values: false
      # 缓存过期时间
      time-to-live: 60s
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    local-cache-scope: statement
    # I19 演练暴露：注解 SQL 的 train_code/ticket_status 等下划线列需映射到驼峰属性
    map-underscore-to-camel-case: true
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: default
# I21 调用 member 出票使用池化 HTTP 连接
feign:
  httpclient:
    max-connections: 200
    max-connections-per-route: 100
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
# I11 对账与指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    metrics:
      enabled: true
train:
  reconcile:
    # 每分钟比对 Redis 与 MySQL；差异以 MySQL 账本为准回写 Redis
    enabled: true
    fixed-delay-ms: 60000
    initial-delay-ms: 30000
    # 对账范围：今天 + 未来 N 天
    days-ahead: 1
  metrics:
    # mq_consume_lag 采集的 主题:消费组 列表
    mq-consumers: order-confirm:business-order-confirm,ticket-create:member-ticket-create
    mq-lag-refresh-ms: 60000
    mq-lag-initial-delay-ms: 60000
    # I18 死信数量 mq_dlq_total 采集的主题
    dlq-topics: '%DLQ%business-order-confirm'
    dlq-refresh-ms: 60000
    dlq-initial-delay-ms: 60000
  # I18 应用内告警：DLQ>0、积压超阈值、库存差异持续 3 分钟
  alerts:
    evaluate-ms: 30000
    initial-delay-ms: 15000
    mq-lag-threshold: 100
    drift-sustain-ms: 180000
  close:
    # I12 超时关闭：ZSet 主触发（秒级）+ 扫表兜底（5 分钟）
    enabled: true
    poll-interval-ms: 5000
    poll-initial-delay-ms: 10000
    poll-batch: 100
    sweep-interval-ms: 300000
    sweep-initial-delay-ms: 60000
    sweep-batch: 200
  # I16 候补补位：失败退避 30s 后由推进器按原 seq_no 放回主队列
  waitlist:
    retry-enabled: true
    retry-poll-ms: 1000
    retry-initial-delay-ms: 5000
    retry-batch: 100
