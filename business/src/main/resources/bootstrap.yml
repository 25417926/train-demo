# 注册中心名字
spring:
  application:
    name: business
  # 启动环境，nacos会根据不同的配置dataid：member-dev.properties
  cloud:
    #Sentinel控台
    sentinel:
      transport:
        port: 8719
        dashboard: localhost:18080
      # sentinel数据源
      datasource:
        # 流控规则
        flow:
          nacos:
            server-addr: localhost:8848
            data-id: sentinel-flow
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: flow
        # 熔断规则
        degrade:
          nacos:
            server-addr: localhost:8848
            data-id: sentinel-degrade
            group-id: DEFAULT_GROUP
            namespace: train
            rule-type: degrade
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: train
      config:
        server-addr: localhost:8848  # nacos server地址
        file-extension: properties  # 配置中心文件后缀
        data-id: business-dev.properties
        # 导入配置
        import:
          - "nacos:"
        #这里为命名空间，设置的值是id不是name
        #namespace: train
        namespace: train
  # 配置中心文件
  profiles:
    active: dev
seata:
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      namespace: train
      group: SEATA_GROUP
      username: nacos
      password: nacos
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: train
      group: SEATA_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  # 事务组id 同项目多个模块配置成同一个事务组
  tx-service-group: train-group
  # 配置事务组
  #下面这些完全是放入配置中心配置的
